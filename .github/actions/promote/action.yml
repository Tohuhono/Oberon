name: Promote
description: Alias a tested Vercel deployment to its production domain

inputs:
  staging-url:
    description: Tested deployment URL
    required: true
  production-url:
    description: Production domain
    required: true

runs:
  using: composite
  steps:
    - name: Setup project
      uses: ./.github/actions/setup-project
      with:
        turbo-cache-key: promote
    - name: Alias build to production
      shell: bash
      run: |
        npx --yes vercel@52.0.0 alias \
          "${{ inputs.staging-url }}" \
          "${{ inputs.production-url }}" \
          --token="${{ env.VERCEL_API_TOKEN }}" \
          --scope "${{ env.VERCEL_SCOPE }}"
