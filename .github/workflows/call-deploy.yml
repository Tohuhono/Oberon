name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      project:
        required: true
        type: string
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string
      db_branch:
        required: false
        type: string
    outputs:
      url:
        description: The deployment url
        value: ${{ jobs.deploy.outputs.url }}
    secrets:
      VERCEL_PROJECT_ID:
        required: true
      VERCEL_API_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      DATABASE_URL:
        required: false
      NEON_API_KEY:
        required: false
      NEON_PROJECT_ID:
        required: false
      AUTH_SECRET:
        required: false

run-name: ${{ format('Deploy {0}', inputs.project ) }}

jobs:
  deploy:
    name: ${{ format('{0} {1}', inputs.environment, inputs.project) }}
    environment:
      name: ${{ format('{0}-{1}', inputs.environment, inputs.project) }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      DATABASE_BRANCH: ${{ inputs.db_branch }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_ENVIRONMENT: ${{ inputs.environment }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      MASTER_EMAIL: ${{ vars.MASTER_EMAIL }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          package-manager-cache: false
      - name: Corepack
        run: corepack enable pnpm
      - name: Enable pnpm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
      - name: Cache turbo build setup
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Install
        run: pnpm i
      - name: Build and deploy
        id: deploy
        run: |
          pnpm run deploy
          echo "url=$(tail -n 1 .vercel/DEPLOY_LOG)" >> "$GITHUB_OUTPUT"
      - name: Upload deployment log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-log-${{ inputs.project }}
          path: .vercel/DEPLOY_LOG
          if-no-files-found: warn
          include-hidden-files: true
