name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.ref }}"
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  changed-packages:
    name: Changed Packages
    runs-on: ubuntu-latest
    outputs:
      changed-packages: ${{ steps.changes.outputs.changed-packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Find changed packages
        id: changes
        uses: ./.github/actions/changed-packages
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          base: ${{ github.event.pull_request.base.sha || github.event.before }}

  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      USE_DEVELOPMENT_DATABASE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate
        uses: ./.github/actions/validate

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      USE_DEVELOPMENT_DATABASE: "true"
      USE_DEVELOPMENT_SEND: "true"
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET }}
      MASTER_EMAIL: ${{ vars.E2E_MASTER_EMAIL }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run E2E tests
        uses: ./.github/actions/e2e

  create-oberon-app:
    name: Create Oberon App
    runs-on: ubuntu-latest
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run Create Oberon App tests
        uses: ./.github/actions/create-oberon-app

  deploy-docs:
    name: Deploy Docs
    needs: [changed-packages]
    if:
      ${{ always() && contains(needs.changed-packages.outputs.changed-packages,
      '@oberon/docs') }}
    runs-on: ubuntu-latest
    environment:
      name:
        ${{ format('{0}-oberon-docs', github.event_name == 'pull_request' && 'preview' ||
        'production') }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_ENVIRONMENT:
        ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      MASTER_EMAIL: ${{ vars.MASTER_EMAIL }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy
        with:
          project: oberon-docs
      - name: Add deployment URL to job summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: echo "[Docs]($DEPLOYMENT_URL)" >> "$GITHUB_STEP_SUMMARY"

  deploy-playground:
    name: Deploy Playground
    needs: [changed-packages]
    if:
      ${{ always() && contains(needs.changed-packages.outputs.changed-packages,
      '@oberon/playground') }}
    runs-on: ubuntu-latest
    environment:
      name:
        ${{ format('{0}-playground', github.event_name == 'pull_request' && 'preview' ||
        'production') }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      DATABASE_BRANCH:
        ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.number)
        || 'main' }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_ENVIRONMENT:
        ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      MASTER_EMAIL: ${{ vars.MASTER_EMAIL }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy
        with:
          project: playground
      - name: Add deployment URL to job summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: echo "[Developer Playground]($DEPLOYMENT_URL)" >> "$GITHUB_STEP_SUMMARY"

  deploy-newground:
    name: Deploy Newground
    needs: [changed-packages]
    if:
      ${{ always() && contains(needs.changed-packages.outputs.changed-packages,
      '@oberon/newground') }}
    runs-on: ubuntu-latest
    environment:
      name:
        ${{ format('{0}-newground', github.event_name == 'pull_request' && 'preview' ||
        'production') }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      DATABASE_BRANCH:
        ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.number)
        || 'main' }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_ENVIRONMENT:
        ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      MASTER_EMAIL: ${{ vars.MASTER_EMAIL }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy
        with:
          project: newground
      - name: Add deployment URL to job summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: echo "[TanStack Playground]($DEPLOYMENT_URL)" >> "$GITHUB_STEP_SUMMARY"

  smoke-docs:
    name: Smoke Test Docs
    needs: [deploy-docs]
    runs-on: ubuntu-latest
    environment:
      name:
        ${{ format('{0}-oberon-docs', github.event_name == 'pull_request' && 'preview' ||
        'production') }}
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Smoke-test deployment
        uses: ./.github/actions/smoke
        with:
          project: oberon-docs
          base-url: ${{ needs.deploy-docs.outputs.url }}

  smoke-playground:
    name: Smoke Test Playground
    needs: [deploy-playground]
    runs-on: ubuntu-latest
    environment:
      name:
        ${{ format('{0}-playground', github.event_name == 'pull_request' && 'preview' ||
        'production') }}
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Smoke-test deployment
        uses: ./.github/actions/smoke
        with:
          project: playground
          base-url: ${{ needs.deploy-playground.outputs.url }}

  smoke-newground:
    name: Smoke Test Newground
    needs: [deploy-newground]
    runs-on: ubuntu-latest
    environment:
      name:
        ${{ format('{0}-newground', github.event_name == 'pull_request' && 'preview' ||
        'production') }}
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Smoke-test deployment
        uses: ./.github/actions/smoke
        with:
          project: newground
          base-url: ${{ needs.deploy-newground.outputs.url }}

  test-status:
    name: CI / Test Status
    needs:
      [
        changed-packages,
        validate,
        e2e,
        create-oberon-app,
        deploy-docs,
        deploy-playground,
        deploy-newground,
        smoke-docs,
        smoke-playground,
        smoke-newground,
      ]
    if: always()
    runs-on: ubuntu-latest
    env:
      STATUS:
        "${{ (contains(needs.*.result, 'failure') || contains(needs.*.result,
        'cancelled')) && 'failed' || 'passed' }}"
    steps:
      - name: Failing deploy
        if: ${{ env.STATUS == 'failed' }}
        run: exit 1

  promote-docs:
    name: Promote Docs
    needs: [test-status, deploy-docs]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-oberon-docs
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Promote
        uses: ./.github/actions/promote
        with:
          staging-url: ${{ needs.deploy-docs.outputs.url }}
          production-url: www.oberoncms.com

  promote-playground:
    name: Promote Playground
    needs: [test-status, deploy-playground]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-playground
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Promote
        uses: ./.github/actions/promote
        with:
          staging-url: ${{ needs.deploy-playground.outputs.url }}
          production-url: playground.tohuhono.com

  promote-newground:
    name: Promote Newground
    needs: [test-status, deploy-newground]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-newground
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Promote
        uses: ./.github/actions/promote
        with:
          staging-url: ${{ needs.deploy-newground.outputs.url }}
          production-url: newground.tohuhono.com

  smoke-production-docs:
    name: Smoke Test Production Docs
    needs: [promote-docs]
    runs-on: ubuntu-latest
    environment: production-oberon-docs
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Smoke-test production domain
        uses: ./.github/actions/smoke
        with:
          project: oberon-docs
          base-url: https://www.oberoncms.com

  smoke-production-playground:
    name: Smoke Test Production Playground
    needs: [promote-playground]
    runs-on: ubuntu-latest
    environment: production-playground
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Smoke-test production domain
        uses: ./.github/actions/smoke
        with:
          project: playground
          base-url: https://playground.tohuhono.com

  smoke-production-newground:
    name: Smoke Test Production Newground
    needs: [promote-newground]
    runs-on: ubuntu-latest
    environment: production-newground
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Smoke-test production domain
        uses: ./.github/actions/smoke
        with:
          project: newground
          base-url: https://newground.tohuhono.com

  ci-summary:
    name: CI Summary
    needs:
      [
        changed-packages,
        validate,
        e2e,
        create-oberon-app,
        deploy-docs,
        deploy-playground,
        deploy-newground,
        smoke-docs,
        smoke-playground,
        smoke-newground,
        test-status,
        promote-docs,
        promote-playground,
        promote-newground,
        smoke-production-docs,
        smoke-production-playground,
        smoke-production-newground,
      ]
    if: always()
    runs-on: ubuntu-latest
    env:
      CHANGED_PACKAGES: ${{ needs.changed-packages.result }}
      VALIDATE: ${{ needs.validate.result }}
      E2E: ${{ needs.e2e.result }}
      CREATE_APP: ${{ needs.create-oberon-app.result }}
      TEST_STATUS: ${{ needs.test-status.result }}
      DOCS_DEPLOY: ${{ needs.deploy-docs.result }}
      DOCS_SMOKE: ${{ needs.smoke-docs.result }}
      DOCS_PROMOTE: ${{ needs.promote-docs.result }}
      DOCS_PRODUCTION_SMOKE: ${{ needs.smoke-production-docs.result }}
      PLAYGROUND_DEPLOY: ${{ needs.deploy-playground.result }}
      PLAYGROUND_SMOKE: ${{ needs.smoke-playground.result }}
      PLAYGROUND_PROMOTE: ${{ needs.promote-playground.result }}
      PLAYGROUND_PRODUCTION_SMOKE: ${{ needs.smoke-production-playground.result }}
      NEWGROUND_DEPLOY: ${{ needs.deploy-newground.result }}
      NEWGROUND_SMOKE: ${{ needs.smoke-newground.result }}
      NEWGROUND_PROMOTE: ${{ needs.promote-newground.result }}
      NEWGROUND_PRODUCTION_SMOKE: ${{ needs.smoke-production-newground.result }}
    steps:
      - name: Add workflow summary
        shell: bash
        run: |
          {
            echo "## CI summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Changed packages | $CHANGED_PACKAGES |"
            echo "| Validation | $VALIDATE |"
            echo "| E2E tests | $E2E |"
            echo "| Create Oberon App | $CREATE_APP |"
            echo "| Test status gate | $TEST_STATUS |"
            echo
            echo "| App | Deploy | Smoke | Promote | Production smoke |"
            echo "| --- | --- | --- | --- | --- |"
            printf '| Docs | %s | %s | %s | %s |\n' \
              "$DOCS_DEPLOY" "$DOCS_SMOKE" "$DOCS_PROMOTE" "$DOCS_PRODUCTION_SMOKE"
            printf '| Playground | %s | %s | %s | %s |\n' \
              "$PLAYGROUND_DEPLOY" "$PLAYGROUND_SMOKE" "$PLAYGROUND_PROMOTE" "$PLAYGROUND_PRODUCTION_SMOKE"
            printf '| Newground | %s | %s | %s | %s |\n' \
              "$NEWGROUND_DEPLOY" "$NEWGROUND_SMOKE" "$NEWGROUND_PROMOTE" "$NEWGROUND_PRODUCTION_SMOKE"
          } >> "$GITHUB_STEP_SUMMARY"
