name: Neon Cleanup
on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [preview-playground, preview-newground]
    environment: ${{ matrix.environment }}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      BRANCH_NAME: preview/pr-${{ github.event.number }}
    steps:
      - name: Check Neon configuration
        run: |
          if [[ -z "$NEON_API_KEY" || -z "$NEON_PROJECT_ID" ]]; then
            echo "::error::Set NEON_API_KEY and NEON_PROJECT_ID secrets in the preview environment."
            exit 1
          fi

      - name: Install Neon CLI
        run: npm install -g neonctl@2.22.0

      - name: Delete Branch
        run: |
          set -euo pipefail
          BRANCH_ID=$(neonctl branches list --project-id "$NEON_PROJECT_ID" --output json |
            jq -r --arg NAME "$BRANCH_NAME" '.[] | select(.name == $NAME) | .id')
          if [[ -z "$BRANCH_ID" ]]; then
            echo "Branch $BRANCH_NAME does not exist; nothing to delete."
            exit 0
          fi
          neonctl branches delete "$BRANCH_ID" --project-id "$NEON_PROJECT_ID"
