name: Neon Cleanup
on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [preview-playground, preview-newground]
    environment: ${{ matrix.environment }}
    steps:
      - name: Install Neon CLI
        run: npm install -g neonctl@2.22.0
      - name: Delete Branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_NAME: "preview/pr-${{ github.event.number }}"
        run: neonctl branches delete "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID"
