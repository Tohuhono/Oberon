packages:
  - "apps/*"
  - "dev/*"
  - "packages/create-oberon-app"
  - "packages/oberoncms/*"
  - "packages/plugins/*"
  - "packages/tohuhono/*"
  - "recipes/*"
nodeVersion: "24.21.0"
publicHoistPattern:
  - "*"
allowBuilds:
  bufferutil: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
overrides:
  zod-validation-error: ^4.0.0
packageExtensions:
  # Twoslash's legacy compiler API is not compatible with TypeScript 7:
  # https://github.com/shuding/nextra/issues/5046
  twoslash:
    dependencies:
      typescript-legacy: npm:typescript@6.0.3
patchedDependencies:
  nextra: patches/nextra.patch
  # Zod >=4.4 compatibility; remove when a release includes this fix:
  # https://github.com/shuding/nextra/pull/4990
  nextra-theme-docs: patches/nextra-theme-docs.patch
  vitest: patches/vitest.patch
  twoslash: patches/twoslash.patch
minimumReleaseAgeExclude:
  - vite@8.3.3
